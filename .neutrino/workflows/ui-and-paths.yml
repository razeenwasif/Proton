# Proton's .github/workflows/ui-and-paths.yml (the Linux jobs), on Neutrino.
#
# UI contracts and portable paths, on every push and pull request. Changes
# from the GitHub version:
#   * ubuntu-latest  ->  containers on Graviton (arm64 Linux): node:22-slim for
#     the UI, and for the Rust suites node:22-slim with a compiler, git and
#     rustup added. Slim images and no debug info, since a container's files
#     live in its VM's RAM.
#   * setup-node's npm cache and the toolchain are Neutrino caches
#   * `if: runner.os != 'Windows'` steps simply run: this is Linux
#   * upload-artifact on failure  ->  the Playwright report and results are
#     kept as the run's artifacts
#   * the macOS and Windows legs of the matrices are in native.yml
#   * proton-study, proton-voice and proton-core's `study` test are left out:
#     they aren't on master yet (the GitHub workflow names them anyway, and
#     fails there). Add them back when they land.

name: UI contracts and portable paths

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

env:
  npm_config_cache: /workspace/.npm

jobs:
  ui-contract:
    image: node:22-slim
    resources: { cpus: 2, memory: 2G }
    timeout-minutes: 15
    cache:
      - key: npm-${{ hashFiles('package-lock.json') }}
        path: .npm
        restore-keys: [npm-]
    steps:
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - run: node --check ui/app.js && node --check ui/bridge.js

  ui-browser:
    image: node:22-slim
    resources: { cpus: 2, memory: 4G }
    timeout-minutes: 15
    artifacts: [playwright-report, test-results]
    cache:
      - key: npm-${{ hashFiles('package-lock.json') }}
        path: .npm
        restore-keys: [npm-]
    steps:
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  paths:
    image: node:22-slim
    resources: { cpus: 2, memory: 4G }
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # The workspace belongs to the Mac's user, the job runs as root.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      CARGO_HOME: /workspace/.cargo
      RUSTUP_HOME: /workspace/.rustup
      PATH: /workspace/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    cache:
      - key: rust-${{ hashFiles('Cargo.lock') }}
        path: [.cargo, .rustup, target]
        restore-keys: [rust-]
    steps:
      # cmake builds wasmtime's C API.
      - name: Install a compiler, cmake and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake curl ca-certificates git pkg-config
      - name: Install Rust (kept in the cache)
        run: command -v cargo >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
      - run: cargo test --locked -p proton-agent --lib --test transport --test gemini --test assemble
      - run: cargo test --locked -p proton-core --lib
      - run: cargo test --locked -p proton-core --test layout --test workspaces --test working_directory --test home_folder --test reliability
      - run: cargo test --locked -p proton-research
      - run: cargo test --locked -p proton-literature
      - run: cargo test --locked -p proton-library --lib
      - run: cargo test --locked -p proton-mcp
      - run: cargo test --locked -p proton-claude --lib --test engines --test fold
      - run: cargo test --locked -p proton-lab
      - run: git diff --exit-code -- ui/bindings
      - run: cargo test --locked -p proton-council --lib
