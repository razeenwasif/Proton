<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet grid frame times</title>
<style>
  :root { --bg: #faf9f5; --ink: #1f1e1d; --muted: #6f6d66; --before: #c9c6bc; --after: #d97757; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1e1d; --ink: #f2f0e8; --muted: #9b988e; --before: #4a4945; } }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink); font: 14px/1.5 ui-sans-serif, -apple-system, sans-serif; }
  h1 { margin: 0 0 4px; font: 600 18px/1.3 inherit; }
  p { margin: 0 0 18px; color: var(--muted); }
  .bars { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 90px 1fr 56px; align-items: center; gap: 10px; }
  .track { height: 18px; border-radius: 4px; background: rgba(127, 127, 127, .12); overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Fleet grid frame times</h1>
<p>Median and worst frame during a telemetry burst, before and after memoising the ranking.</p>
<div class="bars" id="bars"></div>
<script>
  const data = [["Before · p50", 31, "var(--before)"], ["After · p50", 9, "var(--after)"], ["Before · p99", 74, "var(--before)"], ["After · p99", 15, "var(--after)"]];
  const max = Math.max(...data.map((d) => d[1]));
  document.getElementById("bars").innerHTML = data.map(([label, ms, colour]) =>
    `<div class="row"><span>${label}</span><div class="track"><div class="fill" style="width:${(ms / max) * 100}%;background:${colour}"></div></div><span class="num">${ms} ms</span></div>`).join("");
</script>
</body>
</html>
