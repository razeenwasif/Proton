[workspace]
resolver = "2"
members = [
    "crates/proton-agent",
    "crates/proton-core",
    "crates/proton-dap",
    "crates/proton-data",
    "crates/proton-design",
    "crates/proton-index",
    "crates/proton-library",
    "crates/proton-mcp",
    "crates/proton-lsp",
    "crates/proton-plugin",
    "crates/proton-shell",
    "crates/proton-syntax",
    "crates/proton-term",
    "crates/proton-text",
    "crates/proton-trace",
    "crates/proton-vcs",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/razeenwasif/Proton"

[workspace.dependencies]
proton-agent = { path = "crates/proton-agent" }
proton-core = { path = "crates/proton-core" }
proton-dap = { path = "crates/proton-dap" }
proton-data = { path = "crates/proton-data" }
proton-design = { path = "crates/proton-design" }
proton-index = { path = "crates/proton-index" }
proton-library = { path = "crates/proton-library" }
proton-mcp = { path = "crates/proton-mcp" }
proton-lsp = { path = "crates/proton-lsp" }
proton-plugin = { path = "crates/proton-plugin" }
proton-syntax = { path = "crates/proton-syntax" }
proton-term = { path = "crates/proton-term" }
proton-text = { path = "crates/proton-text" }
proton-trace = { path = "crates/proton-trace" }
proton-vcs = { path = "crates/proton-vcs" }
gix = "0.87"
portable-pty = "0.9"
vt100 = "0.16"
gix-imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"

[profile.dev]
# The shell pulls in a large dependency tree; optimising it once makes the
# debug loop bearable without giving up debuggability of our own crates.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
