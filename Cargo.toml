[workspace]
resolver = "2"
members = [
    "crates/proton-agent",
    "crates/proton-circuit",
    "crates/proton-claude",
    "crates/proton-council",
    "crates/proton-core",
    "crates/proton-dap",
    "crates/proton-data",
    "crates/proton-index",
    "crates/proton-lab",
    "crates/proton-library",
    "crates/proton-literature",
    "crates/proton-logic",
    "crates/proton-mcp",
    "crates/proton-lsp",
    "crates/proton-plugin",
    "crates/proton-research",
    "crates/proton-sheet",
    "crates/proton-shell",
    "crates/proton-study",
    "crates/proton-syntax",
    "crates/proton-term",
    "crates/proton-text",
    "crates/proton-trace",
    "crates/proton-vcs",
    "crates/proton-voice",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/razeenwasif/Proton"

[workspace.dependencies]
proton-agent = { path = "crates/proton-agent" }
proton-claude = { path = "crates/proton-claude" }
proton-circuit = { path = "crates/proton-circuit" }
proton-voice = { path = "crates/proton-voice" }
proton-council = { path = "crates/proton-council" }
proton-core = { path = "crates/proton-core" }
proton-dap = { path = "crates/proton-dap" }
proton-data = { path = "crates/proton-data" }
proton-sheet = { path = "crates/proton-sheet" }
proton-index = { path = "crates/proton-index" }
proton-library = { path = "crates/proton-library" }
proton-literature = { path = "crates/proton-literature" }
proton-logic = { path = "crates/proton-logic" }
proton-mcp = { path = "crates/proton-mcp" }
proton-lsp = { path = "crates/proton-lsp" }
proton-plugin = { path = "crates/proton-plugin" }
proton-research = { path = "crates/proton-research" }
proton-lab = { path = "crates/proton-lab" }
proton-study = { path = "crates/proton-study" }
proton-syntax = { path = "crates/proton-syntax" }
proton-term = { path = "crates/proton-term" }
proton-text = { path = "crates/proton-text" }
proton-trace = { path = "crates/proton-trace" }
proton-vcs = { path = "crates/proton-vcs" }
gix = "0.87"
portable-pty = "0.9"
vt100 = "0.16"
gix-imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "10"

[profile.dev]
# The shell pulls in a large dependency tree; optimising it once makes the
# debug loop bearable without giving up debuggability of our own crates.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Symbols were 16 MB of a 74 MB binary nobody debugs from the bundle; thin
# LTO lets the crates be optimised across one another for a little time at
# build. Unwinding stays: the shell's recovery from a poisoned lock catches
# panics, which `panic = "abort"` would end.
strip = true
lto = "thin"

# What runs at build time — proc-macros, build scripts — is not stripped:
# Xcode's strip takes a proc-macro dylib's Rust metadata with its symbols,
# and a fresh release build then fails with "can't find crate for
# `thiserror_impl`". The shipped binary is stripped all the same.
[profile.release.build-override]
strip = false
