<!doctype html>
<meta charset="utf-8">
<title>Game renderer probe</title>
<canvas id="c" style="width:64px;height:64px"></canvas>
<script type="module">
  // Game mode's renderer, drawn small and read back: a red square on the left,
  // the same red hazed half to blue on the right, over a green ground.
  import {createGameRender} from '/game-render.js';
  const canvas = document.getElementById('c');
  const render = createGameRender(canvas);
  const result = {gl: Boolean(render)};
  if (render) {
    const red = new ImageData(new Uint8ClampedArray([255, 0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255]), 2, 2);
    render.upload('red', await createImageBitmap(red), 'nearest');
    const sprite = (x, tint) => ({key: 'red', plane: 'p', item: 'i', x, y: 0, w: 32, h: 64, rot: 0, flip: false, opacity: 1, tint, blend: 'normal'});
    render.draw([sprite(0, [0, 0, 0, 0]), sprite(32, [0, 0, 1, 0.5])], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0]);
    result.left = render.probe(16, 32);
    result.right = render.probe(48, 32);
    render.draw([], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0]);
    result.ground = render.probe(16, 32);
    // A skeleton: a square on a bone turned a quarter, 16 along — so it
    // covers x 0 to 16, y 0 to 16 of the skeleton — standing at 32, 40:
    // drawn between two sprites, then flipped about its feet.
    const blue = new ImageData(new Uint8ClampedArray([0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255, 255]), 2, 2);
    render.upload('blue', await createImageBitmap(blue), 'nearest');
    const {pose} = await import('/game-skel.js');
    const corner = (x, y, u, v) => ({uv: [u, v], bones: [[1, 1, [x, y]]]});
    const model = {format: 1, source: '', atlas: 'blue', atlasSize: [2, 2], fps: 24, boxes: [], clips: [],
      bones: [{name: 'root', parent: null, at: [0, 0], rot: 0, skew: 0, scale: [1, 1], length: 0}, {name: 'arm', parent: 0, at: [16, 0], rot: 90, skew: 0, scale: [1, 1], length: 0}],
      slots: [{name: 's', bone: 1, shown: 0, color: [1, 1, 1, 1], parts: [{name: 'p', points: [corner(0, 0, 0, 0), corner(16, 0, 2, 0), corner(16, 16, 2, 2), corner(0, 16, 0, 2)], triangles: [[0, 1, 2], [0, 2, 3]]}]}]};
    const skeleton = (flip) => ({key: 'blue', plane: 'p', item: null, x: 32, y: 40, w: 0, h: 0, rot: 0, flip, opacity: 1, tint: [0, 0, 0, 0], blend: 'normal',
      skel: {model, posed: pose(model, null, 0), at: [32, 40], pivot: [0, 0]}});
    const small = (x) => ({...sprite(x, [0, 0, 0, 0]), y: 0, w: 8, h: 8});
    render.draw([small(0), skeleton(false), small(56)], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0]);
    result.skel = [render.probe(40, 48), render.probe(24, 48), render.probe(4, 4), render.probe(60, 4)];
    render.draw([skeleton(true)], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0]);
    result.flipped = [render.probe(24, 48), render.probe(40, 48)];

    // Light: white art lit red from the left over a dim ambient, and unlit.
    const solid = async (key, rgba) => render.upload(key, await createImageBitmap(new ImageData(new Uint8ClampedArray([...rgba, ...rgba, ...rgba, ...rgba]), 2, 2)), 'nearest');
    await solid('white', [255, 255, 255, 255]);
    await solid('facing-right', [255, 128, 128, 255]);
    const all = (key, more = {}) => ({key, plane: 'p', item: 'i', x: 0, y: 0, w: 64, h: 64, rot: 0, flip: false, opacity: 1, tint: [0, 0, 0, 0], blend: 'normal', ...more});
    const lamp = (x, height = 80, radius = 32) => ({x, y: 32, radius, height, color: [1, 0, 0]});
    const dim = {ambient: [0.1, 0.1, 0.1], lights: [lamp(16)]};
    render.draw([all('white', {lit: true})], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0], dim);
    result.lit = [render.probe(16, 32), render.probe(60, 32)];
    render.draw([all('white')], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0], dim);
    result.unlit = render.probe(60, 32);
    // A normal map facing right: lit by a light to its right, not its left.
    const facing = (x) => {
      render.draw([all('white', {lit: true, normal: 'facing-right'})], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 1, 0], {ambient: [0.1, 0.1, 0.1], lights: [lamp(x, 1, 64)]});
      return render.probe(32, 32);
    };
    result.normal = [facing(48), facing(16)];
    // Bloom: a bright square spills past its edge, only when finished.
    const square = all('white', {x: 28, y: 28, w: 8, h: 8});
    const finished = (post) => {
      render.draw([square], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 0, 0], {ambient: [1, 1, 1], lights: [], post});
      return render.probe(38, 32);
    };
    result.bloom = [finished({bloom: 1, vignette: 0, quality: 'high'}), finished(null), finished({bloom: 1, vignette: 0, quality: 'low'})];
    // A grade that turns every colour round: red becomes cyan.
    const n = 16;
    const lut = new Uint8ClampedArray(n * n * n * 4);
    for (let y = 0; y < n; y++) for (let x = 0; x < n * n; x++) lut.set([255 - (x % n) * 17, 255 - y * 17, 255 - Math.floor(x / n) * 17, 255], (y * n * n + x) * 4);
    render.upload('lut', await createImageBitmap(new ImageData(lut, n * n, n)), 'linear');
    await solid('red', [255, 0, 0, 255]);
    render.draw([all('red')], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 0, 0], {ambient: [1, 1, 1], lights: [], post: {bloom: 0, vignette: 0, grade: 'lut', quality: 'medium'}});
    result.graded = render.probe(32, 32);
    // A vignette darkens the corners, not the middle.
    render.draw([all('white')], {scale: 1, x: 0, y: 0}, 64, 64, 1, [0, 0, 0], {ambient: [1, 1, 1], lights: [], post: {bloom: 0, vignette: 1, quality: 'medium'}});
    result.vignette = [render.probe(32, 32), render.probe(1, 1)];
  }
  window.result = result;
</script>
