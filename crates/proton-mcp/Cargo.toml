[package]
name = "proton-mcp"
description = "Proton's library, offered to any MCP client over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "proton-mcp"
path = "src/main.rs"

[dependencies]
proton-core = { workspace = true }
proton-library = { workspace = true }
proton-study = { workspace = true }
serde_json = { workspace = true }
# A page drawn for a model, as MCP carries a picture.
base64 = "0.22"

[dev-dependencies]
# A PDF written by hand, for the literature's tests.
proton-library = { workspace = true, features = ["fixture"] }
