[package]
name = "proton-data"
description = "Proton's notebook runtime: the Jupyter wire protocol, and the documents it runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zmq = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
ts-rs = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }
base64 = "0.22"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
# A kernel leads a process group of its own, stopped as one.
libc = "0.2"
