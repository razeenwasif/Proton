[package]
name = "proton-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Your own documents, cut into passages and searched with citations."

[features]
# Building a small real PDF, so a test elsewhere in the workspace can have
# one without carrying a binary fixture in the repository.
fixture = ["dep:lopdf"]

[dependencies]
# A PowerPoint's slides are XML.
quick-xml = "0.41"
# A web page's article, found in its HTML.
dom_query = "0.27"
ignore = "0.4"
pdf-extract = "0.12.0"
# For the local embedding model. No TLS features: it talks to
# localhost, and a vector never leaves the machine.
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = { workspace = true }
lopdf = { version = "0.42", optional = true }

[dev-dependencies]
proton-library = { path = ".", features = ["fixture"] }
