[package]
name = "proton-study"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Notebook's notebooks: the files they are, the sources they read, and what is made of them."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
proton-library = { workspace = true }
proton-research = { workspace = true }
# A source's digest: the same file added twice is said, not kept twice.
sha2 = "0.10"
# Notes open with TOML front matter, as Research's hypotheses do.
toml = "0.9"

# Where today begins, here: the local time's offset.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proton-library = { workspace = true, features = ["fixture"] }
