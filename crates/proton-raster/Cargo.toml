[package]
name = "proton-raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Canvas mode's engine: layered raster images in tiles, changed by ops in whole numbers only, so the window's WebAssembly and the core make the same pixels."

[features]
default = ["io"]
# Reading and writing files: the core's. The window's WebAssembly is built
# without it.
io = ["dep:png"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
png = { version = "0.17", optional = true }
