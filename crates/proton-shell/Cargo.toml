[package]
name = "proton-shell"
description = "Proton's desktop shell: window, webview, and the bridge to proton-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
proton-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["macos-private-api", "image-png"] }
window-vibrancy = "0.8.0"

# Already in the tree through Tauri and window-vibrancy; named here to mark the
# window opaque, which Tauri has no call for.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
