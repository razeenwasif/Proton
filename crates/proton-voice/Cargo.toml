[package]
name = "proton-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Voices: speech from Fish Audio, over a transport a test can script, its key never printed."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Blocking HTTP over rustls with the platform's certificates, as the
# literature and the agent use: no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls", "json", "platform-verifier"] }
