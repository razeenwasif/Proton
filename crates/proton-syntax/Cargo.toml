[package]
name = "proton-syntax"
description = "Proton's syntax highlighting: tree-sitter parsing and viewport-scoped queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proton-text = { workspace = true }
serde = { workspace = true }
ropey = "1.6"
tree-sitter = { version = "0.27", features = ["wasm"] }
ts-rs = { workspace = true }

# Grammars. Each one is a C build, so this list is a real cost in compile time
# and is kept to languages someone is plausibly editing here rather than to
# everything that exists.
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-asm = "0.24.0"
# LaTeX, for the LaTeX mode: latex-lsp's grammar, which texlab is written against.
codebook-tree-sitter-latex = "0.6"
