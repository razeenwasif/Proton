name: UI contracts and portable paths
on: [push, pull_request]
permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - run: node --check ui/app.js && node --check ui/bridge.js

  ui-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p proton-agent --lib --test transport --test gemini --test assemble
      - run: cargo test --locked -p proton-core --lib
      - run: cargo test --locked -p proton-core --test layout --test workspaces --test working_directory --test home_folder --test reliability
      # Research's investigations: the files, the scoring, the prompts.
      - run: cargo test --locked -p proton-research
      # The literature: the sources' answers as recorded, read offline; the
      # worker, the gates and the PDF download over a scripted network.
      - run: cargo test --locked -p proton-literature
      # The library, and the MCP server Research's calls read the papers
      # through: PDFs read past an investigation's .gitignore, citations from
      # its folder, the literature served page by page. Not yet run on Windows.
      - run: cargo test --locked -p proton-library --lib
        if: runner.os != 'Windows'
      - run: cargo test --locked -p proton-mcp
        if: runner.os != 'Windows'
      # Notebook: notebooks as files, their sources read and kept, the lock;
      # and the whole of it through the session, over a knowledge base of its
      # own with a file said to be in iCloud. Not yet run on Windows, as the
      # library it reads with is not.
      - run: cargo test --locked -p proton-study
        if: runner.os != 'Windows'
      - run: cargo test --locked -p proton-core --test study
        if: runner.os != 'Windows'
      # The engines as Research drives them unattended: their flags, and
      # turns recorded from the real CLIs replayed. Not yet run on Windows.
      - run: cargo test --locked -p proton-claude --lib --test engines --test fold
        if: runner.os != 'Windows'
      # The Lab: what conda answers, read; and a fake conda driven through a
      # plan, a make and a removal (those need a POSIX shell, so not Windows).
      - run: cargo test --locked -p proton-lab
      - run: git diff --exit-code -- ui/bindings
